app = "ecommerce-site-backend-api" # You can change this to a unique app name on Fly
primary_region = "sin" # Singapore region (closest to Pakistan/India, change if needed)

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8080"
  # Add other non-sensitive env variables here if needed
  # Sensitive variables like DATABASE_URL should be set via `fly secrets set`

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

[[http_service.checks]]
  grace_period = "10s"
  interval = "15s"
  method = "GET"
  timeout = "2s"
  path = "/api/catalog" # A simple GET route that doesn't require auth to verify server is up
